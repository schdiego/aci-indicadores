name: Atualizar indicadores

on:
  # Roda na hora sempre que o código for atualizado no GitHub (ignora os commits
  # de dados que o próprio robô faz, para não entrar em loop).
  push:
    branches: [main]
    paths-ignore:
      - 'site/dados.json'
      - 'dados/**'
  schedule:
    # Dias 3 e 18 de cada mês, 06:17 de Brasília (09:17 UTC).
    # O CAGED sai no fim do mês seguinte, o CNPJ da Receita em meados do mês
    # e o Bolsa Família ao longo do mês, então duas rodadas pegam tudo.
    - cron: '17 9 3,18 * *'
  workflow_dispatch:
    inputs:
      fonte:
        description: 'Coletar só uma fonte (empresas, emprego, bolsa). Vazio = todas.'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-indicadores
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    # A primeira execução baixa o histórico do CAGED desde 2020 e a base do CNPJ (~11 GB).
    timeout-minutes: 340
    outputs:
      coleta: ${{ steps.coleta.outcome }}
    steps:
      # Sempre parte da versão mais nova da main (uma execução que ficou na fila
      # não pode partir de um commit antigo, senão o push dos dados é recusado).
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar 7-Zip (microdados do CAGED)
        run: sudo apt-get update -q && sudo apt-get install -y -q p7zip-full

      - name: Coletar dados
        id: coleta
        continue-on-error: true
        env:
          PORTAL_TRANSPARENCIA_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_KEY }}
        run: |
          if [ -n "${{ inputs.fonte }}" ]; then
            node src/index.js --so=${{ inputs.fonte }}
          else
            node src/index.js
          fi

      - name: Salvar dados no repositório
        if: always()
        continue-on-error: true
        run: |
          git config user.name "aci-indicadores-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/dados.json dados/
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza indicadores ($(date +%Y-%m-%d))"
          # Se a main mudou durante a coleta, reaplica o commit por cima (os dados novos prevalecem).
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main
          done
          exit 1

      - uses: actions/configure-pages@v6
        if: always()
      - uses: actions/upload-pages-artifact@v5
        if: always()
        with:
          path: site

  publicar:
    needs: coletar
    if: always() && needs.coletar.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Avisar se alguma fonte falhou
        if: needs.coletar.outputs.coleta == 'failure'
        run: |
          echo "::error::Alguma fonte falhou na coleta. Os dados anteriores dela foram mantidos no site. Veja o passo 'Coletar dados'."
          exit 1
