name: Atualizar indicadores

on:
  # Roda na hora sempre que o código for atualizado no GitHub (ignora os commits
  # de dados que o próprio robô faz, para não entrar em loop).
  push:
    branches: [main]
    paths-ignore:
      - 'site/dados.json'
      - 'dados/**'
  schedule:
    # Dias 3 e 18 de cada mês, 06:17 de Brasília (09:17 UTC).
    # O CAGED sai no fim do mês seguinte, o CNPJ da Receita em meados do mês
    # e o Bolsa Família ao longo do mês, então duas rodadas pegam tudo.
    - cron: '17 9 3,18 * *'
  workflow_dispatch:
    inputs:
      fonte:
        description: 'Coletar só uma fonte (empresas, emprego, bolsa). Vazio = todas.'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-indicadores
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    # A primeira execução baixa o histórico do CAGED desde 2020 e a base do CNPJ (~11 GB).
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar 7-Zip (microdados do CAGED)
        run: sudo apt-get update -q && sudo apt-get install -y -q p7zip-full

      - name: Coletar dados
        id: coleta
        continue-on-error: true
        env:
          PORTAL_TRANSPARENCIA_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_KEY }}
        run: |
          if [ -n "${{ inputs.fonte }}" ]; then
            node src/index.js --so=${{ inputs.fonte }}
          else
            node src/index.js
          fi

      - name: Salvar dados no repositório
        if: always()
        run: |
          git config user.name "aci-indicadores-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/dados.json dados/
          git diff --cached --quiet || git commit -m "Atualiza indicadores ($(date +%Y-%m-%d))"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar no GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Avisar se alguma fonte falhou
        if: steps.coleta.outcome == 'failure'
        run: |
          echo "::error::Alguma fonte falhou na coleta. Os dados anteriores dela foram mantidos no site. Veja o passo 'Coletar dados'."
          exit 1
